apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          image: mellgitson/todo-api:1ba421369fbb9abc7b5610696fc3f823d6067f86
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-secret
          # /health ne verifie pas la base : une base coupee laisse le pod
          # 1/1 Ready alors que /api/tasks renvoie 500. Design assume, pas
          # corrige ici (voir docs/PROCEDURE_DEPLOIEMENT.md).
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
