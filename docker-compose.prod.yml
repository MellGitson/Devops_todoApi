services:
  todo-db:
    container_name: todo-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  todo-api:
    container_name: todo-api
    image: ${REGISTRY_USER}/todo-api:${TAG:-1.0.0}
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: todo-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      todo-db:
        condition: service_healthy
    restart: unless-stopped

  stats-api:
    container_name: todo-stats-api
    image: ${REGISTRY_USER}/stats-api:${TAG:-1.0.0}
    environment:
      DB_HOST: todo-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${STATS_PORT:-8000}:8000"
    depends_on:
      todo-db:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    container_name: todo-adminer
    image: adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - todo-db
    profiles: ["dev"]

  prometheus:
    container_name: todo-prometheus
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - todo-api
    restart: unless-stopped

  grafana:
    container_name: todo-grafana
    image: grafana/grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  todo_pgdata:
  grafana_data:
