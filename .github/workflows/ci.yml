name: CI
# Pipeline: test sur toutes les branches, build+push sur main uniquement
# verif: secret Docker Hub retire
# verif: runner arrete, job reste Queued

on:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo_db
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: todo_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_user -d todo_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: todo_db
          DB_USER: todo_user
          DB_PASSWORD: todo_pass

  build:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}

  deploy:
    needs: [build]
    runs-on: self-hosted # ce job tourne chez vous, a cote du cluster todo-cluster
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Mettre a jour l'image et attendre la convergence du rollout
        run: |
          kubectl -n todo set image deployment/todo-api todo-api=${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}
          kubectl -n todo rollout status deployment/todo-api --timeout=120s

      - name: Verifier /health
        run: |
          curl -sf --retry 8 --retry-delay 2 --retry-all-errors -H "Host: todo.localhost" http://localhost:8080/health
